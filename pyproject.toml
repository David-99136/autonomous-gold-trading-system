[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-system"
version = "0.1.0"
description = "Auditable Gold CFD offline execution prototype and Demo discovery"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
credentials = ["keyring>=25,<26"]

[project.scripts]
gold-system = "gold_system.cli:main"

[tool.setuptools.packages.find]
include = ["gold_system*"]
